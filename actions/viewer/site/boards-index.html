<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__TITLE__</title>
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      })();
    </script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="breadcrumb">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="current">__TITLE__</span>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <main class="container">
      <section class="page-head">
        <h1>__TITLE__</h1>
        <div class="status-pills" aria-label="Build status">
          <span class="pill" data-state="__CHECKS_STATE__">__CHECKS_TEXT__</span>
          <span class="pill" data-state="__OUTPUTS_STATE__">__OUTPUTS_TEXT__</span>
          <span class="pill" data-state="__MODELS_STATE__">__MODELS_TEXT__</span>
          <span class="pill plain"><code>__SHA__</code></span>
          <a class="pill plain link" href="__RUN_URL__">Actions run &rarr;</a>
        </div>
      </section>
      <section class="section">
        <div class="section-heading">
          <h2>Boards</h2>
          <p>Select a board to review the schematic, PCB, reports, fabrication files, and 3D model.</p>
        </div>
        <div class="board-grid">
__BOARDS__
        </div>
      </section>
    </main>
    <script src="theme.js"></script>
  </body>
</html>
