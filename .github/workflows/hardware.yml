name: Hardware CI

on:
  push:
    paths:
      - "hardware/**"
      - "actions/**"
      - ".github/workflows/hardware.yml"
      - ".github/kicad-viewer.yml"
      - ".github/hardware/**"
  pull_request:
    paths:
      - "hardware/**"
      - "actions/**"
      - ".github/workflows/hardware.yml"
      - ".github/kicad-viewer.yml"
      - ".github/hardware/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover KiCad projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover KiCad projects
        id: discover
        uses: ./actions/discover

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build KiCad project
        uses: ./actions/build
        with:
          project: ${{ toJson(matrix) }}

  viewer:
    name: Publish review site
    runs-on: ubuntu-latest
    needs:
      - discover
      - build
    if: ${{ always() && needs.discover.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.viewer.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish KiCad review site
        id: viewer
        uses: ./actions/viewer
        with:
          projects: ${{ needs.discover.outputs.projects }}
          title: Hardware Boards
          deploy: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}

  hardware-summary:
    name: Hardware links
    runs-on: ubuntu-latest
    needs:
      - discover
      - build
      - viewer
    if: ${{ always() && needs.discover.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download KiCad build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: "*-kicad-build"
          path: check-artifacts

      - name: Add ERC and DRC issues to run summary
        if: ${{ always() }}
        shell: bash
        env:
          PROJECTS_JSON: ${{ needs.discover.outputs.projects }}
        run: |
          set -euo pipefail
          python3 .github/hardware/report_summary.py \
            --projects-json "$PROJECTS_JSON" \
            --artifacts-dir check-artifacts >> "$GITHUB_STEP_SUMMARY"

  hardware-gate:
    name: Hardware CI gate
    runs-on: ubuntu-latest
    needs:
      - discover
      - build
      - viewer
      - hardware-summary
    if: ${{ always() }}

    steps:
      - name: Fail if validation, outputs, or the review site failed
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${DISCOVER_RESULT:-failure}" != "success" ]; then
            echo "Project discovery failed or did not complete: ${DISCOVER_RESULT:-missing}"
            failed=1
          fi

          if [ "${BUILD_RESULT:-failure}" != "success" ]; then
            echo "KiCad build failed, was skipped, or did not complete: ${BUILD_RESULT:-missing}"
            failed=1
          fi

          if [ "${VIEWER_RESULT:-failure}" != "success" ]; then
            echo "Review site failed or did not complete: ${VIEWER_RESULT:-missing}"
            failed=1
          fi

          exit "$failed"
